<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Cucine - Premium Concept</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #050505 0%, #1a1a1a 100%);
      color: white;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .header-marca {
      margin-bottom: 40px;
      text-align: center;
    }

    .header-marca p {
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: #a3a3a3;
      margin: 0;
    }

    .letrero-interactivo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 90vw;
      max-width: 500px;
    }

    .cuadro {
      height: 180px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: all 0.4s ease;
    }

    /* Capa de imagen de fondo oculta */
    .cuadro::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease;
      z-index: 1;
      opacity: 0.25; 
      filter: grayscale(80%);
    }

    /* Colores e imágenes base (Fotos de alta calidad temporales) */
    .caja-art { background-color: #1a1110; }
    .caja-art::before { background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=800&auto=format&fit=crop'); }

    .caja-cucine { background-color: #8a1f13; }
    .caja-cucine::before { background-image: url('https://images.unsplash.com/photo-1556910103-1c02745a872f?q=80&w=800&auto=format&fit=crop'); }

    .caja-closet { background-color: #4a0d11; }
    .caja-closet::before { background-image: url('https://images.unsplash.com/photo-1558997519-83ea9252edf8?q=80&w=800&auto=format&fit=crop'); }

    .caja-bano { background-color: #0f203b; }
    .caja-bano::before { background-image: url('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=800&auto=format&fit=crop'); }

    /* Efecto "Wow" al tocar / pasar el cursor */
    .cuadro:hover, .cuadro:active {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }

    .cuadro:hover::before, .cuadro:active::before {
      transform: scale(1.15); /* Zoom suave a la foto */
      opacity: 0.6; /* Revela la foto */
      filter: grayscale(0%); /* Le devuelve el color */
    }

    /* Texto */
    .cuadro h2 {
      position: relative;
      z-index: 2;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: lowercase;
      margin: 0;
      text-shadow: 2px 2px 15px rgba(0,0,0,1);
      transition: transform 0.4s ease;
    }

    .cuadro:hover h2, .cuadro:active h2 {
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <div class="header-marca">
    <p>Diseño & Exclusividad</p>
  </div>

  <div class="pantalla-principal">
    <div class="letrero-interactivo">
      <div class="cuadro caja-art"><h2>art</h2></div>
      <div class="cuadro caja-cucine"><h2>cucine</h2></div>
      <div class="cuadro caja-closet"><h2>closet</h2></div>
      <div class="cuadro caja-bano"><h2>baño</h2></div>
    </div>
  </div>

</body>
</html>
